name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json requires node >=20; cover the floor and current LTS.
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build entrypoint matches the start script
        run: test -f dist/src/index.js

  secrets:
    name: no committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The connector's core promise is that credentials never leak. A real
      # .env must never be committed; .env.example holds placeholders only.
      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git; it must stay untracked."
            exit 1
          fi

      - name: Fail if .env.example contains a real-looking token
        run: |
          if grep -nP '=(?!replace-with-)[A-Za-z0-9_~-]{25,}' .env.example; then
            echo "::error::.env.example looks like it contains a real credential."
            exit 1
          fi

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: canvas-mcp-connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # health_check is the only tool that needs no Canvas credentials, so it
      # proves the image boots and speaks MCP without a live Canvas instance.
      - name: Smoke test the image over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | timeout 60 docker run -i --rm \
              -e CANVAS_BASE_URL=https://canvas.example.invalid \
              -e CANVAS_API_TOKEN=ci-placeholder-token \
              -e CANVAS_CAPABILITIES=read_profile,read_courses,read_assignments \
              canvas-mcp-connector:ci \
          | tee /dev/stderr \
          | grep -q '"name":"health_check"'
